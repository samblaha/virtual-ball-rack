<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Golf Ball Rack</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f5f0e6' stroke='%235a1e24' stroke-width='2'/%3E%3Ccircle cx='11' cy='12' r='1.5' fill='%23c9c0ac'/%3E%3Ccircle cx='17' cy='10' r='1.5' fill='%23c9c0ac'/%3E%3Ccircle cx='21' cy='15' r='1.5' fill='%23c9c0ac'/%3E%3Ccircle cx='13' cy='18' r='1.5' fill='%23c9c0ac'/%3E%3Ccircle cx='19' cy='21' r='1.5' fill='%23c9c0ac'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="title-block">
        <h1>The Ball Rack</h1>
        <p class="subtitle">A virtual replica of the display case &mdash; every logo ball from every course played</p>
      </div>
      <div id="stats" class="stats"></div>
    </div>
  </header>

  <main class="layout">
    <section class="rack-panel">
      <div class="rack-case">
        <div class="rack-hinge rack-hinge-top"></div>
        <div class="rack-hinge rack-hinge-bottom"></div>
        <div id="rack" class="rack"></div>
      </div>
      <p class="rack-caption">Click a ball to see the course and find it on the map. Balls marked
        <span class="uncertain-dot"></span> are best guesses from the photo.</p>
    </section>

    <section class="info-panel">
      <div id="detail" class="detail-card empty">
        <p class="detail-hint">Select a ball from the rack&hellip;</p>
      </div>
      <div id="map" class="map"></div>
      <div class="course-list-wrap">
        <h2>Courses Played</h2>
        <div id="course-list" class="course-list"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>78 balls &bull; built from a photo of the real rack</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
